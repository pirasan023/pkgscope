name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.88.0

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Validate tag, Cargo, npm, lockfile, and changelog versions
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$version" = "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$version" = "$(jq -r .version npm/package.json)"
          test "$version" = "$(sed -n '/name = "pkgscope"/{n;s/version = "\([^"]*\)"/\1/p;q;}' Cargo.lock)"
          jq -e --arg version "$version" '.optionalDependencies | to_entries | all(.value == $version)' npm/package.json
          grep -q "^## \[$version\]" CHANGELOG.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Validate schemas and package metadata
        run: |
          jq empty docs/schema-v1.json docs/schema-v2.json npm/package.json
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          npm test --prefix npm

  build-native:
    needs: validate
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin
            npm_arch: arm64
            expected: arm64
          - runner: macos-14
            target: x86_64-apple-darwin
            platform: darwin
            npm_arch: x64
            expected: x86_64
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux
            npm_arch: x64
            expected: x86-64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux
            npm_arch: arm64
            expected: ARM aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl linker
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Test and build
        run: |
          cargo test --all-targets --locked
          cargo build --release --locked --target "${{ matrix.target }}"
      - name: Verify exact CPU, static Linux linkage, and real startup
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/pkgscope"
          if [ "${{ matrix.platform }}" = darwin ]; then
            test "$(lipo -archs "$binary")" = "${{ matrix.expected }}"
          else
            file "$binary" | grep -F "${{ matrix.expected }}"
            if readelf -d "$binary" | grep -q NEEDED; then exit 1; fi
            "$binary" --version | grep -Fx "pkgscope ${{ needs.validate.outputs.version }}"
          fi
      - name: Assemble archive
        run: |
          version="${{ needs.validate.outputs.version }}"
          staging="$RUNNER_TEMP/pkgscope-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/pkgscope" LICENSE README.md "$staging/"
          tar -C "$staging" -czf "pkgscope-v${version}-${{ matrix.target }}.tar.gz" pkgscope LICENSE README.md
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ${{ runner.temp }}/pkgscope-${{ matrix.target }}
          format: cyclonedx-json
          output-file: pkgscope-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest archive provenance
        uses: actions/attest@v4
        with:
          subject-path: pkgscope-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pkgscope-${{ matrix.target }}
          if-no-files-found: error
          path: |
            pkgscope-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz
            pkgscope-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.cdx.json

  publish:
    needs: [validate, build-native]
    environment: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pkgscope-*
          path: dist
      - name: Generate checksums and cross-platform Homebrew formula
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          find dist -type f \( -name '*.tar.gz' -o -name '*.cdx.json' \) -print0 | sort -z | xargs -0 sha256sum | sed 's#  .*/#  #' > dist/SHA256SUMS
          archive_sha() { sha256sum "dist/pkgscope-$1/pkgscope-v${version}-$1.tar.gz" | awk '{print $1}'; }
          sed \
            -e "s/@VERSION@/$version/g" \
            -e "s/@DARWIN_ARM64_SHA256@/$(archive_sha aarch64-apple-darwin)/g" \
            -e "s/@DARWIN_X64_SHA256@/$(archive_sha x86_64-apple-darwin)/g" \
            -e "s/@LINUX_ARM64_SHA256@/$(archive_sha aarch64-unknown-linux-musl)/g" \
            -e "s/@LINUX_X64_SHA256@/$(archive_sha x86_64-unknown-linux-musl)/g" \
            packaging/homebrew/pkgscope.rb.template > dist/pkgscope.rb
          ruby -c dist/pkgscope.rb
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm CLI with trusted-publishing support
        run: npm install --global npm@latest
      - name: Publish four exact-version native npm packages, safely retryable
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          while read -r target platform npm_arch; do
            package_name="@pirasan023/pkgscope-${platform}-${npm_arch}"
            package_dir="$RUNNER_TEMP/platform-${platform}-${npm_arch}"
            mkdir -p "$package_dir/bin"
            tar -xzf "dist/pkgscope-${target}/pkgscope-v${version}-${target}.tar.gz" -C "$package_dir/bin" pkgscope
            cp LICENSE README.md "$package_dir/"
            jq -n --arg name "$package_name" --arg version "$version" --arg os "$platform" --arg cpu "$npm_arch" \
              '{name:$name,version:$version,description:"pkgscope native binary",license:"MIT",repository:{type:"git",url:"git+https://github.com/pirasan023/pkgscope.git"},os:[$os],cpu:[$cpu],files:["bin/pkgscope","LICENSE","README.md"],publishConfig:{access:"public",provenance:true}}' \
              > "$package_dir/package.json"
            if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
              echo "${package_name}@${version} already exists; skipping"
            else
              npm publish "$package_dir" --access public --provenance
            fi
          done <<'TARGETS'
          aarch64-apple-darwin darwin arm64
          x86_64-apple-darwin darwin x64
          aarch64-unknown-linux-musl linux arm64
          x86_64-unknown-linux-musl linux x64
          TARGETS
      - name: Publish exact-version npm launcher, safely retryable
        run: |
          set -euo pipefail
          package_name="$(jq -r .name npm/package.json)"
          version="${{ needs.validate.outputs.version }}"
          if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
            echo "${package_name}@${version} already exists; skipping"
          else
            npm publish ./npm --access public --provenance
          fi
      - name: Create GitHub release with archives, checksums, SBOMs, and formula
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/**/*.tar.gz
            dist/**/*.cdx.json
            dist/SHA256SUMS
            dist/pkgscope.rb

  verify-published-linux:
    name: Verify published Linux ${{ matrix.arch }} from empty installs
    needs: [validate, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            target: x86_64-unknown-linux-musl
            expected: x86-64
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
            expected: ARM aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install from npm using the public OS-independent command
        run: |
          set -euo pipefail
          npm install --global @pirasan023/pkgscope@${{ needs.validate.outputs.version }}
          pkgscope --version | grep -Fx 'pkgscope ${{ needs.validate.outputs.version }}'
          pkgscope --quiet doctor
          pkgscope --quiet list --format table >/dev/null || test "$?" = 3
          pkgscope --quiet list --format json > "$RUNNER_TEMP/npm.json" || test "$?" = 3
          pkgscope --quiet list --format jsonl > "$RUNNER_TEMP/npm.jsonl" || test "$?" = 3
          pkgscope --quiet list --format csv > "$RUNNER_TEMP/npm.csv" || test "$?" = 3
          jq -e '.schema_version == 2 and .host.linux_distribution.id != null' "$RUNNER_TEMP/npm.json"
          jq -e '.schema_version == 2 and .type == "scan"' < <(head -n 1 "$RUNNER_TEMP/npm.jsonl")
          test -s "$RUNNER_TEMP/npm.csv"
          npx --yes --package ajv-cli@5 --package ajv-formats@3 ajv validate --spec=draft2020 -c ajv-formats -s docs/schema-v2.json -d "$RUNNER_TEMP/npm.json"
      - name: Download and authenticate the matching GitHub archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/archive"
          gh release download "v${{ needs.validate.outputs.version }}" --pattern 'pkgscope-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz' --pattern SHA256SUMS --dir "$RUNNER_TEMP/archive"
          (cd "$RUNNER_TEMP/archive" && grep 'pkgscope-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz' SHA256SUMS | sha256sum --check)
          gh attestation verify "$RUNNER_TEMP/archive/pkgscope-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz" --repo "${{ github.repository }}"
          tar -xzf "$RUNNER_TEMP/archive/pkgscope-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz" -C "$RUNNER_TEMP/archive"
          file "$RUNNER_TEMP/archive/pkgscope" | grep -F '${{ matrix.expected }}'
          if readelf -d "$RUNNER_TEMP/archive/pkgscope" | grep -q NEEDED; then exit 1; fi
          "$RUNNER_TEMP/archive/pkgscope" --version | grep -Fx 'pkgscope ${{ needs.validate.outputs.version }}'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Exercise the published binary through the TUI deletion-safety test
        env:
          PKGSCOPE_TEST_BINARY: ${{ runner.temp }}/archive/pkgscope
        run: cargo test --locked --test tui_pty
